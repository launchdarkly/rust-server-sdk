name: Check Supported Rust Versions
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check-rust-versions:
    permissions:
      contents: write
      pull-requests: write
    uses: launchdarkly/gh-actions/.github/workflows/sdk-rust-versions.yml@main
    with:
      cargo_tomls: |
        launchdarkly-server-sdk/Cargo.toml
        contract-tests/Cargo.toml
